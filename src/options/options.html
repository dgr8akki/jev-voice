<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Voice settings</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body data-next="Open the Jev Voice side panel to start.">
    <main>
      <header class="brand">
        <span class="mark">
          <svg width="26" height="26" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="12" r="3.2" fill="currentColor" stroke="none" />
            <path d="M16.5 6v12" />
          </svg>
        </span>
        <div>
          <h1>Jev Voice</h1>
          <p class="muted">Control the browser with your voice.</p>
        </div>
      </header>

      <section id="connected" class="card" aria-labelledby="connected-title" hidden>
        <div class="connected-head">
          <svg class="ok-icon" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M8 12.5l2.7 2.7L16 9.8" />
          </svg>
          <div>
            <h2 id="connected-title">Connected via <span id="provider-label"></span></h2>
            <code id="masked" class="badge"></code>
          </div>
        </div>
        <div class="actions">
          <button id="test" type="button" class="btn btn-secondary">Test</button>
          <button id="replace" type="button" class="btn btn-secondary">Replace</button>
          <button id="remove" type="button" class="btn btn-danger">Remove</button>
        </div>
        <p id="connected-status" class="status" role="status"></p>
      </section>

      <form id="key-form" class="card" aria-labelledby="connect-title" hidden>
        <p id="current" class="current" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M8 12.5l2.7 2.7L16 9.8" />
          </svg>
          <span>Connected via <span id="current-provider"></span></span>
          <code id="current-masked" class="badge"></code>
        </p>
        <div class="intro">
          <h2 id="connect-title">Connect Jev</h2>
          <p class="muted">
            Jev Voice calls Jev with your own API key, so you pay your provider directly. A command costs about $0.0001.
          </p>
        </div>
        <fieldset class="providers">
          <legend>Provider</legend>
          <div class="tiles">
            <label class="tile">
              <input type="radio" name="provider" value="vercel" />
              <span class="dot" aria-hidden="true"></span>
              <span>
                <strong>Vercel AI Gateway</strong>
                <small>Billed to your Vercel account, with spend limits.</small>
              </span>
            </label>
            <label class="tile">
              <input type="radio" name="provider" value="typesafe" />
              <span class="dot" aria-hidden="true"></span>
              <span>
                <strong>TypeSafe</strong>
                <small>Jev direct from its makers, billed by TypeSafe.</small>
              </span>
            </label>
          </div>
        </fieldset>
        <ol id="steps" class="steps"></ol>
        <div class="field">
          <label for="api-key">API key</label>
          <div class="row">
            <input
              id="api-key"
              class="input"
              type="password"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="key-status"
              required
            />
            <div class="row-buttons">
              <button type="submit" class="btn btn-primary">Connect</button>
              <button id="cancel" type="button" class="btn btn-secondary" hidden>Cancel</button>
            </div>
          </div>
        </div>
        <p id="key-status" class="status" role="status"></p>
      </form>

      <footer class="muted">
        Your key is stored only in this browser and sent only to <code id="host"></code>. See the
        <a href="https://github.com/dgr8akki/jev-voice/blob/main/PRIVACY.md" target="_blank" rel="noreferrer"
          >privacy policy</a
        >.
      </footer>
    </main>
  </body>
</html>
