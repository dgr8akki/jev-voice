<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Voice: allow the microphone</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        min-height: 100vh;
        padding: 32px 72px;
      }
      main {
        max-width: 460px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .disc {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border: 1.5px solid var(--jv-accent);
        border-radius: 50%;
        color: var(--jv-accent-text);
      }
      h1 {
        font-size: 1.875rem;
      }
      p.muted {
        font-size: 0.9375rem;
        text-wrap: pretty;
      }
      #allow {
        min-height: 48px;
        padding: 0 20px;
      }
      @media (max-width: 500px) {
        body {
          padding: 32px 18px;
        }
      }
    </style>
    <script type="module" src="permission.js"></script>
  </head>
  <body>
    <main>
      <span class="disc">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
        </svg>
      </span>
      <h1>Allow the microphone</h1>
      <p class="muted">
        Side panels can’t ask for microphone access, so Jev Voice asks here once. Audio is transcribed by your browser
        and never recorded.
      </p>
      <button id="allow" type="button" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
        </svg>
        Allow microphone
      </button>
      <p id="status" class="status" role="status"></p>
    </main>
  </body>
</html>
