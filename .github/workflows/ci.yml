name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Files listed in SHARED.md must match their pinned upstream commit. The
      # shared repo has to be readable from CI; it is private at the moment.
      - run: node scripts/sync-shared.js --check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error
